function pageJK(){
  return `<main class="wrap"><section>${secH('Jawatankuasa induk','Pengerusi, penyelaras dan skop tugas')}<div class="people">${D.jk.map(p=>`<article class="card person"><div class="r">${esc(p.jawatan)}</div><h3>${esc(p.nama)}</h3>${pelan(p.skop)}</article>`).join('')}</div></section>
  <section>${secH('Senarai peneraju teras','Peneraju bagi setiap Kod OS')}<div class="card tw"><table><thead><tr><th>Teras</th><th>Kod OS</th><th>Kod KPI</th><th>Objektif strategik</th><th>Peneraju</th><th>Nama</th></tr></thead><tbody>${D.lead.map(l=>`<tr><td class="code">${esc(l.teras)}</td><td class="code">${esc(l.kod)}</td><td class="num">${esc(l.kodkpi)}</td><td>${esc(l.obj)}</td><td>${esc(l.peneraju)}</td><td>${esc(l.nama)}</td></tr>`).join('')}</tbody></table></div></section></main>`;
}
const NAV=[['dashboard','Utama'],['pemantauan','Pemantauan'],['teras','Teras'],['jawatankuasa','Jawatankuasa']];
function route(keep){
  const fq=document.activeElement&&document.activeElement.id==='fQ';
  const h=(location.hash||'#dashboard').slice(1);let p=h,n=1;
  const m=/^teras-(\d)$/.exec(h);if(m){p='teras';n=Math.min(8,Math.max(1,+m[1]))}else if(h==='teras'){p='teras'}
  if(!NAV.some(x=>x[0]===p))p='dashboard';
  document.getElementById('nav').innerHTML=NAV.map(([k,l])=>`<a href="#${k==='teras'?'teras-'+n:k}" ${k===p?'aria-current="page"':''}>${l}</a>`).join('');
  document.getElementById('view').innerHTML=p==='dashboard'?pageDash():p==='pemantauan'?pagePem():p==='teras'?pageTeras(n):pageJK();
  if(p==='pemantauan'){bindPem();if(fq){const e=document.getElementById('fQ');e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
  if(!keep)window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>route());route();
document.addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(b)openEdit(b.dataset.edit)});
function openEdit(kod){
  const r=all.find(x=>x.kod===kod);if(!r)return;const u=U[kod]||{};
  const ov=document.createElement('div');ov.className='ov';
  const cur=r.k==='idle'?'run':r.k;
  ov.innerHTML=`<form class="card dlg" id="eForm"><h3>Kemas kini pencapaian</h3><p class="code">${esc(kod)} · ${esc(r.teras)}</p><p class="sub">${esc(r.kpi.replace(/\s+/g,' '))}</p>
  <label for="fS">Status</label><select id="fS">${['ok','run','bad','idle'].map(k=>`<option value="${ST[k][0]}" ${k===cur?'selected':''}>${ST[k][0]}</option>`).join('')}</select>
  <label for="fC">Pencapaian sebenar</label><input id="fC" value="${esc(u.capai||'')}" placeholder="Contoh: 85% atau 12 aktiviti"><small>Sasaran 2026: ${fmt(r.sasaran)}</small>
  <label for="fN">Catatan (pilihan)</label><textarea id="fN" rows="3">${esc(u.catatan||'')}</textarea>
  <div class="row"><button type="button" id="eX">Batal</button><button class="save" id="eOk" type="submit">Simpan</button></div><p id="eMsg" role="status"></p></form>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove(),msg=document.getElementById('eMsg');
  document.getElementById('eX').onclick=close;ov.addEventListener('click',e=>{if(e.target===ov)close()});
  document.getElementById('fS').focus();
  document.getElementById('eForm').onsubmit=async ev=>{
    ev.preventDefault();const btn=document.getElementById('eOk');btn.disabled=true;msg.textContent='Menyimpan…';
    try{
      await DB.doc('updates/'+kod).set({kod,teras:r.teras,status:document.getElementById('fS').value,capai:document.getElementById('fC').value.trim(),catatan:document.getElementById('fN').value.trim(),by:UID,at:Date.now()});
      close();
    }catch(err){
      btn.disabled=false;
      if(err&&err.code==='invalid_argument'){EDIT=false;READONLY=true;msg.textContent='Anda tiada kebenaran mengemas kini. Minta pemilik portal beri akses Contributor.';route(true)}
      else msg.textContent='Tidak berjaya disimpan. Cuba lagi sebentar lagi.';
    }
  };
}
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db)return;
    DB=db;UID=user?await user.id():null;
    const cw=user?await user.can('data.write'):null;
    EDIT=cw!==false;READONLY=cw===false;route(true);
    db.collection('updates').onSnapshot(async snap=>{
      Object.keys(U).forEach(k=>delete U[k]);
      snap.docs.forEach(d=>{const v=d.data();if(v&&v.kod)U[d.id]=v});
      const ids=[...new Set(Object.values(U).map(u=>u.by).filter(Boolean))];
      if(user&&ids.length){try{const ps=await user.profiles(ids);ids.forEach(i=>NAMES[i]=ps[i]&&ps[i].name||'')}catch(e){}}
      recalc();route(true);
    },()=>{});
  }catch(e){}
})();
</script>

</body></html>
